
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Room | Grand Stay</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #252b36;
        }

        header {
            background: #17243a;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        main {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px #00000010;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            background: #17243a;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 22px;
        }

        button:hover {
            opacity: 0.85;
        }

        .cancel {
            display: inline-block;
            margin-left: 12px;
            color: #17243a;
            text-decoration: none;
        }

        .error {
            color: #c62828;
        }
    </style>
</head>

<body>

<header>
    <h2>Grand Stay — Edit Room</h2>
    <a href="/rooms">Back to Rooms</a>
</header>

<main>
    <section class="form-box">
        <h1>Edit Room Details</h1>
        <p>Update the room information below.</p>

        <p class="error"
           th:if="${error}"
           th:text="${error}"></p>

        <form th:action="@{/rooms/edit}" method="post">

            <input type="hidden"
                   name="roomId"
                   th:value="${room.roomId}">

            <div class="form-grid">

                <div>
                    <label for="roomNumber">Room Number</label>
                    <input id="roomNumber"
                           name="roomNumber"
                           th:value="${room.roomNumber}"
                           required
                           maxlength="10">
                </div>

                <div>
                    <label for="roomType">Room Type</label>
                    <select id="roomType" name="roomType" required>
                        <option value="Standard"
                                th:selected="${room.roomType == 'Standard'}">
                            Standard
                        </option>
                        <option value="Deluxe"
                                th:selected="${room.roomType == 'Deluxe'}">
                            Deluxe
                        </option>
                        <option value="Suite"
                                th:selected="${room.roomType == 'Suite'}">
                            Suite
                        </option>
                    </select>
                </div>

                <div>
                    <label for="price">Price per Night (₹)</label>
                    <input id="price"
                           name="price"
                           type="number"
                           min="1"
                           step="0.01"
                           th:value="${room.price}"
                           required>
                </div>

                <div>
                    <label for="status">Status</label>
                    <select id="status" name="status" required>
                        <option value="Available"
                                th:selected="${room.status == 'Available'}">
                            Available
                        </option>
                        <option value="Occupied"
                                th:selected="${room.status == 'Occupied'}">
                            Occupied
                        </option>
                        <option value="Maintenance"
                                th:selected="${room.status == 'Maintenance'}">
                            Maintenance
                        </option>
                    </select>
                </div>

            </div>

            <button type="submit">Save Changes</button>

            <a class="cancel" href="/rooms">Cancel</a>

        </form>
    </section>
</main>

</body>
</html>
