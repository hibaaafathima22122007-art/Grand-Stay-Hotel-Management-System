
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Billing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #243047;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        a, button {
            background: #234e91;
            color: white;
            padding: 10px 15px;
            border: 0;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .pay-button {
            background: #137547;
            padding: 8px 12px;
            white-space: nowrap;
        }

        .paid-status {
            color: #137547;
            font-weight: bold;
        }

        .pending-status {
            color: #b7791f;
            font-weight: bold;
        }

        .panel {
            background: white;
            margin-top: 22px;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #0000000d;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e4e9f1;
        }

        th {
            background: #edf2fa;
        }

        select {
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin-right: 8px;
            max-width: 100%;
        }

        .success {
            color: #137547;
        }

        .error {
            color: #b42318;
        }

        .empty {
            color: #64748b;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <div class="top">
        <div>
            <h1>Billing Management</h1>
            <p>Generate and view guest bills.</p>
        </div>

        <a th:href="@{/dashboard}">Back to Dashboard</a>
    </div>

    <!-- Success and error messages -->
    <p class="success"
       th:if="${success}"
       th:text="${success}"></p>

    <p class="error"
       th:if="${error}"
       th:text="${error}"></p>

    <!-- Generate Bill -->
    <div class="panel">
        <h2>Generate a Bill</h2>

        <form th:action="@{/billing/create}" method="post">
            <label for="bookingId">Select booking:</label>

            <select name="bookingId" id="bookingId" required>
                <option value="">-- Select a booking --</option>

                <option th:each="b : ${eligibleBookings}"
                        th:value="${b.booking_id}"
                        th:text="${'#' + b.booking_id + ' - ' + b.full_name
                          + ' | Room ' + b.room_number
                          + ' | ' + b.nights + ' nights | ₹'
                          + b.price}">
                </option>
            </select>

            <button type="submit">Generate Bill</button>
        </form>

        <p class="empty"
           th:if="${#lists.isEmpty(eligibleBookings)}">
            No bookings are currently eligible for a new bill.
        </p>
    </div>

    <!-- Generated Bills -->
    <div class="panel">
        <h2>Generated Bills</h2>

        <table>
            <thead>
            <tr>
                <th>Bill ID</th>
                <th>Booking ID</th>
                <th>Guest</th>
                <th>Room</th>
                <th>Nights</th>
                <th>Total Amount</th>
                <th>Payment Status</th>
                <th>Bill Date</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="bill : ${bills}">
                <td th:text="${bill.billId}"></td>

                <td th:text="${bill.bookingId}"></td>

                <td th:text="${bill.guestName}"></td>

                <td th:text="${bill.roomNumber}"></td>

                <td th:text="${bill.nights}"></td>

                <td th:text="${'₹' + bill.totalAmount}"></td>

                <td>
                    <span th:if="${bill.paymentStatus == 'Paid'}"
                          class="paid-status">
                        Paid
                    </span>

                    <span th:if="${bill.paymentStatus != 'Paid'}"
                          class="pending-status"
                          th:text="${bill.paymentStatus}">
                    </span>
                </td>

                <td th:text="${bill.billDate}"></td>

                <!-- Payment Action -->
                <td>
                    <form th:if="${bill.paymentStatus == 'Pending'}"
                          th:action="@{/billing/pay}"
                          method="post"
                          onsubmit="return confirm('Confirm that this bill has been paid?');">

                        <input type="hidden"
                               name="billId"
                               th:value="${bill.billId}">

                        <button type="submit" class="pay-button">
                            Mark as Paid
                        </button>
                    </form>

                    <span th:if="${bill.paymentStatus == 'Paid'}"
                          class="paid-status">
                        Paid ✓
                    </span>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(bills)}">
                <td colspan="9" class="empty">
                    No bills generated yet.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
