
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Room Management | Grand Stay</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #252b36;
        }

        header {
            background: #17243a;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        header h2 {
            margin: 0;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        header a:hover {
            text-decoration: underline;
        }

        main {
            padding: 35px 8%;
        }

        main h1 {
            margin-bottom: 8px;
        }

        main > p {
            color: #64748b;
        }

        .form-box,
        .table-box {
            background: white;
            padding: 25px;
            margin-top: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px #00000010;
        }

        .form-box h2,
        .table-box h2 {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #1769aa;
            box-shadow: 0 0 0 2px #1769aa20;
        }

        button {
            background: #17243a;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 18px;
        }

        button:hover {
            opacity: 0.85;
        }

        .action-form {
            display: inline-block;
            margin: 0 4px 0 0;
        }

        .action-form button {
            margin-top: 0;
            padding: 9px 13px;
        }

        .edit-button {
            background: #1769aa;
        }

        .delete-button {
            background: #c62828;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            min-width: 650px;
        }

        th,
        td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #edf1f7;
            color: #17243a;
            white-space: nowrap;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .status-label {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
        }

        .status-available {
            color: #18794e;
            background: #dcfce7;
        }

        .status-occupied {
            color: #9a3412;
            background: #ffedd5;
        }

        .status-maintenance {
            color: #b91c1c;
            background: #fee2e2;
        }

        .message,
        .error {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
        }

        .message {
            color: #18794e;
            background: #dcfce7;
        }

        .error {
            color: #b91c1c;
            background: #fee2e2;
        }

        .table-wrap {
            overflow-x: auto;
        }

        .empty-message {
            text-align: center;
            color: #64748b;
            padding: 25px;
        }

        @media (max-width: 600px) {
            header {
                padding: 18px 5%;
                flex-direction: column;
                align-items: flex-start;
            }

            header h2 {
                font-size: 20px;
            }

            main {
                padding: 25px 5%;
            }

            .form-box,
            .table-box {
                padding: 16px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>Grand Stay — Room Management</h2>
    <a href="/dashboard">Back to Dashboard</a>
</header>

<main>
    <h1>Manage Hotel Rooms</h1>
    <p>Add rooms, update room details, and view room status.</p>

    <!-- Add Room Form -->
    <section class="form-box">
        <h2>Add a Room</h2>

        <form action="/rooms" method="post">
            <div class="form-grid">

                <div>
                    <label for="roomNumber">Room Number</label>
                    <input
                            id="roomNumber"
                            name="roomNumber"
                            type="text"
                            maxlength="10"
                            placeholder="e.g. 101"
                            required>
                </div>

                <div>
                    <label for="roomType">Room Type</label>
                    <select id="roomType" name="roomType" required>
                        <option value="Standard">Standard</option>
                        <option value="Deluxe">Deluxe</option>
                        <option value="Suite">Suite</option>
                    </select>
                </div>

                <div>
                    <label for="price">Price per Night (₹)</label>
                    <input
                            id="price"
                            name="price"
                            type="number"
                            min="0.01"
                            step="0.01"
                            placeholder="Enter price"
                            required>
                </div>

                <div>
                    <label for="status">Room Status</label>
                    <select id="status" name="status" required>
                        <option value="Available">Available</option>
                        <option value="Occupied">Occupied</option>
                        <option value="Maintenance">Maintenance</option>
                    </select>
                </div>

            </div>

            <button type="submit">+ Add Room</button>
        </form>

        <!-- Success Message -->
        <p class="message"
           th:if="${message}"
           th:text="${message}">
        </p>

        <!-- Error Message -->
        <p class="error"
           th:if="${error}"
           th:text="${error}">
        </p>
    </section>

    <!-- Room List -->
    <section class="table-box">
        <h2>Room List</h2>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Room Number</th>
                    <th>Room Type</th>
                    <th>Price per Night</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="room : ${rooms}">
                    <td th:text="${room.roomId}"></td>

                    <td th:text="${room.roomNumber}"></td>

                    <td th:text="${room.roomType}"></td>

                    <td th:text="${'₹' + #numbers.formatDecimal(room.price, 1, 2)}"></td>

                    <!-- Colored Room Status -->
                    <td>
                        <span
                                class="status-label"
                                th:text="${room.status}"
                                th:classappend="${
                                room.status == 'Available'
                                ? ' status-available'
                                : (room.status == 'Occupied'
                                    ? ' status-occupied'
                                    : ' status-maintenance')
                            }">
                        </span>
                    </td>

                    <td>
                        <!-- Edit Room -->
                        <a
                                th:href="@{/rooms/edit(roomId=${room.roomId})}"
                                style="text-decoration: none;">

                            <button
                                    type="button"
                                    class="edit-button">
                                Edit
                            </button>
                        </a>

                        <!-- Delete Room -->
                        <form
                                class="action-form"
                                th:action="@{/rooms/delete}"
                                method="post"
                                onsubmit="return confirm('Are you sure you want to delete this room?');">

                            <input
                                    type="hidden"
                                    name="roomId"
                                    th:value="${room.roomId}">

                            <button
                                    type="submit"
                                    class="delete-button">
                                Delete
                            </button>
                        </form>
                    </td>
                </tr>

                <!-- Empty Room List -->
                <tr th:if="${#lists.isEmpty(rooms)}">
                    <td colspan="6" class="empty-message">
                        No rooms added yet. Add your first room above.
                    </td>
                </tr>

                </tbody>
            </table>
        </div>
    </section>
</main>

</body>
</html>
